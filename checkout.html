<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-4WLSH8KSME"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-4WLSH8KSME');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | Ashif Builds</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- Premium Enterprise CSS Design, Boss! --- */
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success: #10b981;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%); 
            padding: 20px; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: var(--text-main);
        }
        
        .checkout-container { 
            background: var(--card-bg); 
            width: 100%;
            max-width: 460px; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.08), 0 1px 3px rgba(0,0,0,0.05); 
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .checkout-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), #a855f7);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .brand-logo {
            max-width: 80px; 
            height: auto;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .brand-name {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .secure-header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ecfdf5;
            color: var(--success);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label { 
            font-weight: 600; 
            font-size: 13px; 
            color: var(--text-muted); 
            display: block; 
            margin-bottom: 8px; 
        }

        input, select { 
            width: 100%; 
            padding: 14px 16px; 
            background: #f9fafb;
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            background: #ffffff;
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .coupon-group input {
            border: 1px dashed #a855f7;
            background-color: #faf5ff;
            font-weight: 600;
            color: #7e22ce;
        }

        /* RECEIPT STYLING */
        .receipt-box {
            background: #f9fafb;
            border: 1px dashed #cbd5e1;
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .receipt-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            color: var(--text-main);
            font-weight: 800;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 2px dashed var(--border-color);
        }

        .btn-pay { 
            background: var(--primary); 
            color: white; 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: 600; 
            margin-top: 10px; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-pay:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        .btn-pay:active { transform: translateY(0); }
        
        .trust-badges {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 24px;
            color: #9ca3af;
            font-size: 12px;
        }

        /* --- COUPON CARD STYLING --- */
        .active-coupons-container {
            width: 100%;
            margin-top: 30px; 
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .section-heading {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
        }

        .ecommerce-coupon-card {
            display: flex;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .ecommerce-coupon-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
        }

        .coupon-left {
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            color: var(--success); 
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 2px dashed #a7f3d0;
            font-weight: 800;
            font-size: 18px;
            text-align: center;
            line-height: 1.1;
        }

        .coupon-right {
            padding: 15px;
            flex: 1;
            text-align: left;
        }

        .coupon-code-box {
            display: inline-block;
            background: #f3f4f6;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--text-main);
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        .coupon-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.5;
        }

        .copy-text {
            font-size: 10px;
            color: var(--primary); 
            margin-left: 8px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    
    <div class="brand-header">
        <img src="/img/logo.jpg" alt="Ashif Builds Logo" class="brand-logo" onerror="this.src='https://ui-avatars.com/api/?name=Ashif+Builds&background=6366f1&color=fff&rounded=true&size=128'">
        <h1 class="brand-name">ASHIF BUILDS</h1>
        <div class="secure-header-badge">
            🔒 Verified & Secure Checkout
        </div>
    </div>
    
    <div class="input-group">
        <label>Select Your Package</label>
        <select id="planSelect" required onchange="updateMath()">
            <option value="" disabled selected>-- Choose a service --</option>
            <option value="student">Job Seekers & Students (₹2,000)</option>
            <option value="localbiz">Local Biz & Startups (₹14,999)</option>
            <option value="social">Social Brands (₹5,999)</option>
        </select>
    </div>
    
    <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="clientName" placeholder="Enter your full name" required>
    </div>
    
    <div class="input-group">
        <label>WhatsApp Number</label>
        <input type="tel" id="clientPhone" placeholder="Enter active WhatsApp number" required>
    </div>

    <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="clientEmail" placeholder="Enter your email address" required>
    </div>

    <div class="input-group coupon-group">
        <label>Promo Code (Optional)</label>
        <input type="text" id="couponCode" placeholder="Enter secret code" oninput="updateMath()">
    </div>

    <!-- Pricing Breakdown Receipt -->
    <div class="receipt-box">
        <div class="receipt-row">
            <span>Base Price:</span> 
            <span id="displayBasePrice" style="font-weight: 600;">₹0.00</span>
        </div>
        
        <div id="promoRow" class="receipt-row" style="display: none; color: #d97706;">
            <span>Promo Discount:</span> 
            <span id="displayPromoDiscount" style="font-weight: 600;">- ₹0.00</span>
        </div>
        
        <div class="receipt-total">
            <span>Total to Pay:</span> 
            <span id="displayFinalAmount">₹0.00</span>
        </div>
    </div>

    <button class="btn-pay" id="mainPayButton" onclick="processPayment()">
        Proceed to Secure Payment ➔
    </button>
    
    <div class="trust-badges">
        <span>✅ 256-bit SSL</span>
        <span>✅ Safe & Encrypted</span>
        <span>✅ 24/7 Support</span>
    </div>

    <div class="active-coupons-container">
        <h3 class="section-heading">Available Offers</h3>

        <div class="ecommerce-coupon-card" onclick="copyCouponCode('WELCOME20', this)">
            <div class="coupon-left">
                20%<br>OFF
            </div>
            <div class="coupon-right">
                <div class="coupon-code-box">
                    WELCOME20 <span class="copy-text" id="promoCopyText">Copy</span>
                </div>
                <p class="coupon-desc">Get a flat 20% discount on all web development packages today.</p>
            </div>
        </div>
    </div>
</div>

<script>
    const planPrices = {
        "student": 2000,
        "localbiz": 14999,
        "social": 5999
    };

    function copyCouponCode(code, cardElement) {
        navigator.clipboard.writeText(code).then(() => {
            document.getElementById('couponCode').value = code;
            updateMath();
            const copyTextSpan = document.getElementById('promoCopyText');
            copyTextSpan.innerText = 'APPLIED!';
            copyTextSpan.style.color = '#10b981';
            setTimeout(() => {
                copyTextSpan.innerText = 'COPY';
                copyTextSpan.style.color = '#6366f1';
            }, 2000);
        });
    }

    function updateMath() {
        var plan = document.getElementById("planSelect").value;
        if (!plan) return;

        let basePrice = planPrices[plan];
        let promoInput = document.getElementById("couponCode").value.trim().toUpperCase();
        let promoDeduction = 0;

        if (promoInput === "WELCOME20") {
            promoDeduction = basePrice * 0.20;
            document.getElementById('promoRow').style.display = 'flex';
            document.getElementById('displayPromoDiscount').innerText = "- ₹" + promoDeduction.toFixed(2);
        } else {
            document.getElementById('promoRow').style.display = 'none';
        }

        let finalAmount = (basePrice - promoDeduction).toFixed(2);

        document.getElementById('displayBasePrice').innerText = "₹" + basePrice.toFixed(2);
        document.getElementById('displayFinalAmount').innerText = "₹" + finalAmount;
    }

    function processPayment() {
        var name = document.getElementById("clientName").value.trim();
        var phone = document.getElementById("clientPhone").value.trim();
        var email = document.getElementById("clientEmail").value.trim();
        var plan = document.getElementById("planSelect").value;
        var code = document.getElementById("couponCode").value.trim().toUpperCase();
        
        if (!name || !phone || !email) {
            alert("Please fill in your Name, WhatsApp Number, and Email first, boss!");
            return; 
        }
        if (!plan) {
            alert("Please select which package you are buying from the dropdown!");
            return;
        }

        var payButton = document.getElementById('mainPayButton');
        payButton.innerText = "Processing Securely... ⌛";
        payButton.disabled = true;
        payButton.style.opacity = "0.7";

        var universalPromo = "WELCOME20"; 
        var finalLink = "";
        var isInvalidCode = false;

        if (plan === "student") {
            finalLink = "https://p.ppsl.io/PYTMPS/3q1amk";
        } else if (plan === "localbiz") {
            finalLink = "https://p.ppsl.io/PYTMPS/Y81amk";
        } else if (plan === "social") {
            finalLink = "https://p.ppsl.io/PYTMPS/if1amk";
        }
        
        if (code !== "" && code !== universalPromo) isInvalidCode = true;
        if (isInvalidCode) alert("Invalid promo code. Proceeding with regular price, sir!");

        var formData = new FormData();
        formData.append("Client Name", name);
        formData.append("WhatsApp Number", phone);
        formData.append("Email Address", email);
        formData.append("Selected Package", plan);
        formData.append("Coupon Used", code || "None");
        formData.append("Payment Method", "PAYTM GATEWAY (COMPLIANT)");

        fetch("https://formspree.io/f/xzdqnpaz", {
            method: "POST",
            body: formData,
            headers: { 'Accept': 'application/json' }
        }).then(response => {
            window.location.href = finalLink;
        }).catch(error => {
            window.location.href = finalLink; 
        });
    }
</script>
</body>
</html>
